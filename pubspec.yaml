
name: ords_ba
description: "A new Flutter project."

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # BA module
  http: ^1.2.2
  flutter_bloc: ^9.1.1
  bloc: ^9.1.0
  equatable: ^2.0.7
  get_storage: ^2.1.1
  intl: ^0.19.0
  google_maps_flutter: ^2.14.0
  geolocator: ^14.0.2
  geocoding: ^4.0.0
  image_picker: ^1.1.2

  # Device binding
  device_info_plus: ^10.1.0
  android_id: ^0.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

  # Application images
  assets:
    - assets/ba_logo.png

  # Application fonts
  fonts:
    - family: ClashGrotesk
      fonts:
        - asset: assets/ClashGrotesk-Light.otf
          weight: 300
        - asset: assets/ClashGrotesk-Medium.otf
          weight: 500
        - asset: assets/ClashGrotesk-Medium.otf
          weight: 700

# Application launcher icon configuration
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/ba_logo.png"
  remove_alpha_ios: true
